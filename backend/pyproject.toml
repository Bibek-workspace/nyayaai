[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # line length already handled by formatter
    "B008",  # FastAPI uses Depends(...) in defaults intentionally
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E", "F", "B"]
"tests/**" = ["F401", "F811"]
